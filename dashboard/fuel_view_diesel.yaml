              const hm = d => d.toLocaleTimeString(LOC, {hour: '2-digit', minute: '2-digit'});
              const when = d => d.toDateString() === now.toDateString() ? hm(d) : d.toLocaleString(LOC, {weekday: 'short', hour: '2-digit', minute: '2-digit'});
              const fa = S && S.attributes.fetched_at ? new Date(S.attributes.fetched_at) : null;
              const la = S && S.attributes.last_attempt ? new Date(S.attributes.last_attempt) : null;
              const err = S && S.attributes.fetch_error;
              const nu = S && S.attributes.next_update ? new Date(S.attributes.next_update) : null;
              const next = nu ? when(nu) : '—';
              const total = S && S.attributes.city_total;
              const hidden = ((S && S.attributes.excluded) || 0) + (all.length - list.length);
              const lines = [];
              lines.push(`<span style="font-size:13px;color:#d6dae1;font-weight:600">${T('table_updated', {t: fa ? when(fa) : '—', n: next})}</span>`);
              if (err) lines.push(`<span style="font-size:12px;color:#f5c26b">${T('refresh_failed', {at: la ? T('at') + when(la) : '', err: err})}</span>`);
              if (total) lines.push(`<span style="font-size:12px;color:#9aa1ad">${T('hidden', {h: hidden, t: total, age: maxAge >= 1 ? T('yesterday_l') : T('today_l')})}</span>`);
              lines.push('<span style="font-size:11px;color:#9aa1ad">' + T('arrows') + ' · <span style="color:#5fd39a">▼ ' + T('down') + '</span> · <span style="color:#f5c26b">— ' + T('stable') + '</span> · <span style="color:#ff7a6b">▲ ' + T('up') + '</span> · ' + T('longpress') + '</span>');
              lines.push('<span style="font-size:11px;color:#5b6270">mBenzin.cz · ' + ((S && S.attributes.fuel_label) || 'Diesel') + (S && S.attributes.fuel === 'n95' ? ' ' + T('e10_note') : '') + ' · ' + T('tap_station') + '</span>');
              return `<div style="display:flex;flex-direction:column;gap:3px;text-align:left">${lines.join('')}</div>`;
