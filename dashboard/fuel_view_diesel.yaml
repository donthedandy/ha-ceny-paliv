                <div style="flex:1 1 auto;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0">
                  <span style="font-size:15px;font-weight:700;color:#eef0f3">${(S && S.attributes.fuel_label) || 'Diesel'} · ${(S && S.attributes.city_name) || ''}</span>
                  <span style="font-size:13px;color:#9aa1ad">${sub}</span></div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0">
                  <span style="font-size:28px;font-weight:800;letter-spacing:-0.02em;line-height:1;color:${min === null ? '#5b6270' : '#5fd39a'}">${min === null ? '—' : fp(min)}</span>
                  <span style="font-size:11px;color:#9aa1ad;font-weight:600">${unit}</span></div>
              </div>`;
            ]]]
