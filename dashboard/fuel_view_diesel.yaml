# Fuel view — Diesel — Home Assistant (sections view)
# Shows: "My station" card (price, 1/2/7/14/30-day trends, rank), top 5 cheapest stations with logos and
#        day-over-day arrows, map with prices, 30-day statistics graph.
# Pohled pro palivo Diesel: karta „Moje stanice“ (cena, trendy za 1/2/7/14/30 dní, pořadí), 5 nejlevnějších
#        stanic s logy a šipkami změny oproti včerejšku, mapa s cenami a graf za 30 dní.
#
# How to add it / Jak ho přidat:
#   Dashboard > Edit > + (add view) > ⋮ > Edit in YAML > replace everything with this file > Save
#   Dashboard > Upravit > + (přidat pohled) > ⋮ > Upravit v YAML > nahradit vše obsahem tohoto souboru > Uložit
#
# Requirements / Požadavky
#   - Frontend: custom:button-card (HACS).
#   - The mBenzin integration with the fuel "diesel" selected. It creates / Integrace mBenzin s vybraným palivem „diesel“:
#       sensor.mbenzin_diesel_top5     summary sensor; attributes: stations[], home, fetched_at, next_update, fetch_error,
#                                   labels (texts in the language chosen in the setup), city_name, ...
#       sensor.mbenzin_diesel_home     your favourite station (only if you picked one) / oblíbená stanice (pokud jste ji vybrali)
#       sensor.mbenzin_diesel_1..5     the 5 cheapest stations, with latitude/longitude (used by the map) / 5 nejlevnějších stanic (mapa)
#   - Texts follow the language chosen in the integration setup (English / Čeština): Settings > Devices & services >
#     mBenzin > Configure. / Jazyk textů se volí v nastavení integrace (English / Čeština).
#   - Logos (optional, not included — trademarks): round 128 px PNGs in config/www/ named after the chain,
#     lowercase, e.g. orlen.png, makro.png, tesco.png, eurobit.png. Add/remove chains in the LOGOS map below.
#     Loga (volitelná, nejsou součástí — ochranné známky): kulatá PNG 128 px v config/www/, pojmenovaná podle řetězce.
#   - Data source / Zdroj dat: mBenzin.cz (personal API key required, 20 requests/hour / osobní klíč, 20 požadavků za hodinu)
title: Diesel
path: fuel_diesel
icon: mdi:gas-station
type: sections
max_columns: 2
sections:
  - type: grid
    cards:
      - type: custom:button-card
        entity: sensor.mbenzin_diesel_home
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: more-info
        hold_action:
          action: none
        custom_fields:
          m: |-
            [[[
            const LB = ((states['sensor.mbenzin_diesel_top5'] || {}).attributes || {}).labels || {};
            const T = (k, v) => String(LB[k] !== undefined ? LB[k] : k).replace(/\{(\w+)\}/g, (m, x) => (v && v[x] !== undefined ? v[x] : m));
            const LOC = LB.locale || 'en-GB';
              const arrow = t => {
                if (!t) return { icon: 'mdi:minus', color: '#5b6270', txt: '—' };
                if (t.dir === 'down') return { icon: 'mdi:arrow-down-bold', color: '#5fd39a', txt: '−' + Math.abs(t.delta).toFixed(2) };
                if (t.dir === 'up') return { icon: 'mdi:arrow-up-bold', color: '#ff7a6b', txt: '+' + Math.abs(t.delta).toFixed(2) };
                return { icon: 'mdi:minus', color: '#f5c26b', txt: '0.00' };
              };
              const a = entity.attributes;
              const stationName = a.station || T('my_station');
              const chain = stationName.split(' ')[0].toLowerCase();
              const ok = !['unavailable', 'unknown'].includes(entity.state);
              const price = ok ? Number(entity.state).toFixed(2) : '—';
              const stale = a.age_days == null || Number(a.age_days) > 1;
              const updTxt = a.age_days == 0 ? T('updated_today') : (a.age_days == 1 ? T('updated_yesterday') : T('price_from', {d: a.updated || '—'}));
              const tr = a.trends || {};
              const today = new Date(); today.setHours(0, 0, 0, 0);
              let partial = null;
              const chip = n => { const t = tr[String(n)]; const r = arrow(t);
                let covered = true;
                if (t) { const target = new Date(today); target.setDate(target.getDate() - n);
                  covered = new Date(t.ref_date + 'T00:00:00') <= target; if (!covered) partial = t.ref_date; }
                return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;background:#1f232b;border-radius:12px;padding:8px 2px;min-width:0">
                  <span style="font-size:11px;font-weight:700;color:#9aa1ad">${n} d${t && !covered ? '*' : ''}</span>
                  <ha-icon icon="${r.icon}" style="--mdc-icon-size:18px;color:${r.color}"></ha-icon>
                  <span style="font-size:13px;font-weight:800;color:${r.color};white-space:nowrap">${r.txt}</span></div>`; };
              const chips = [1, 2, 7, 14, 30].map(chip).join('');
              const anyTrend = Object.values(tr).some(Boolean);
              const note = !anyTrend ? T('trends_start')
                         : (partial ? T('since_partial', {d: new Date(partial + 'T00:00:00').toLocaleDateString(LOC, {day: 'numeric', month: 'short'})}) : '');
              let pos;
              if (a.rank == null) pos = '<span style="color:#f5c26b">' + T('not_ranked') + '</span>';
              else if (Number(a.vs_cheapest) <= 0) pos = `<span style="color:#5fd39a">${T('cheapest_town', {rank: a.rank, n: a.fresh_count})}</span>`;
              else pos = `<span style="color:#f5c26b">${T('vs_cheapest', {d: Number(a.vs_cheapest).toFixed(2), name: a.cheapest_name, rank: a.rank, n: a.fresh_count})}</span>`;
              return `<div style="display:flex;flex-direction:column;gap:12px;width:100%;text-align:left">
                <div style="display:flex;align-items:center;gap:12px">
                  <img src="/local/${chain}.png?v=1" alt="${chain}" onerror="this.style.display='none'" style="width:44px;height:44px;border-radius:999px;flex-shrink:0;display:block">
                  <div style="flex:1 1 auto;display:flex;flex-direction:column;gap:2px;min-width:0">
                    <span style="font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:#9aa1ad">${T('my_station')}</span>
                    <span style="font-size:15px;font-weight:700;color:#eef0f3">${stationName}</span>
                    <span style="font-size:12px;color:${stale ? '#f5c26b' : '#9aa1ad'}">${updTxt}</span></div>
                  <div style="display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0">
                    <span style="font-size:40px;font-weight:800;letter-spacing:-0.03em;line-height:1;color:${stale ? '#9aa1ad' : '#eef0f3'}">${price}</span>
                    <span style="font-size:11px;color:#9aa1ad;font-weight:600">${a.unit_of_measurement || 'Kč/l'}</span></div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px">${chips}</div>
                ${note ? `<span style="font-size:11px;color:#5b6270;margin-top:-4px">${note}</span>` : ''}
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:600">${pos}
                  <span style="color:#5b6270;font-weight:500;white-space:nowrap">${T('tap_history')}</span></div>
              </div>`;
            ]]]
        styles:
          grid:
            - grid-template-areas: '"m"'
          card:
            - padding: 16px
            - background: '#171a20'
            - border: 1px solid rgba(76,195,217,0.30)
            - border-radius: 22px
            - box-shadow: none
            - font-family: Manrope, system-ui, sans-serif
            - --ha-ripple-color: transparent
          custom_fields:
            m:
              - width: 100%
        grid_options:
          columns: full
      - type: custom:button-card
        entity: sensor.mbenzin_diesel_top5
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: none
        hold_action:
          action: more-info
        custom_fields:
          head: |-
            [[[
            const LB = ((states['sensor.mbenzin_diesel_top5'] || {}).attributes || {}).labels || {};
            const T = (k, v) => String(LB[k] !== undefined ? LB[k] : k).replace(/\{(\w+)\}/g, (m, x) => (v && v[x] !== undefined ? v[x] : m));
            const LOC = LB.locale || 'en-GB';
              const S = states['sensor.mbenzin_diesel_top5'];
              const all = (S && Array.isArray(S.attributes.stations)) ? S.attributes.stations : [];
              const maxAge = (S && S.attributes.max_age_days != null) ? Number(S.attributes.max_age_days) : 1;
              const today = new Date(); today.setHours(0, 0, 0, 0);
              const age = s => { if (!s.updated_date) return s.updated === 'Dnes' ? 0 : 99;
                const d = new Date(s.updated_date + 'T00:00:00'); return Math.round((today - d) / 86400000); };
              const list = all.filter(s => age(s) <= maxAge);
              const prices = list.map(s => Number(s.price)).filter(p => !isNaN(p));
              const min = prices.length ? Math.min(...prices) : null;
              const unit = (S && S.attributes.unit_of_measurement) || 'Kč/l';
              const fp = p => Number(p).toFixed(2);
              const upd = s => { const a = age(s); return a <= 0 ? T('today') : (a === 1 ? T('yesterday') : (s.updated || '—')); };
              const n = min === null ? 0 : list.filter(s => Number(s.price) === min).length;
              const sub = min === null ? T('no_recent') : T('cheapest_price', {p: fp(min), unit: unit}) + (n > 1 ? ' · ' + T('stations_same', {n: n}) : '');
