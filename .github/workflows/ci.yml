name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Tests (Home Assistant test harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run tests
        run: python -m pytest -q

  card:
    name: Lovelace card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax
        run: node --check custom_components/ceny_paliv/frontend/ceny-paliv-card.js

  versions:
    name: Versions match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integration and card versions match
        run: |
          python3 - <<'EOF'
          import json, re, pathlib
          root = pathlib.Path("custom_components/ceny_paliv")
          manifest = json.loads((root / "manifest.json").read_text())["version"]
          const = re.search(r'CARD_VERSION = "([^"]+)"', (root / "const.py").read_text()).group(1)
          card = re.search(r"const CARD_VERSION = '([^']+)'", (root / "frontend/ceny-paliv-card.js").read_text()).group(1)
          assert manifest == const == card, (manifest, const, card)
          print("version", manifest)
          EOF

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
